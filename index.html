<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আল ইত্তেহাদ ফাউন্ডেশন - ড্যাশবোর্ড</title>
    <style>
        :root { --primary: #1b4332; --secondary: #2d6a4f; --danger: #e74c3c; --admin: #6a040f; --edit: #f39c12; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        .warning-bar { background: #b91c1c; color: white; text-align: center; padding: 12px; font-weight: bold; position: sticky; top: 0; z-index: 1000; }
        .container { max-width: 1000px; margin: 20px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        
        /* লোগো সেকশন - এবার কোনো লিঙ্ক নেই, সরাসরি কোড */
        .logo-container { margin-bottom: 20px; display: flex; justify-content: center; }
        .logo-container img { 
            width: 140px; height: 140px; 
            border-radius: 50%; border: 5px solid var(--primary); 
            padding: 3px; object-fit: cover; background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .main-title { color: var(--primary); margin: 0 0 20px 0; font-size: 26px; font-weight: bold; }
        .admin-bar { background: #f8fafc; padding: 15px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--primary); color: white; padding: 20px; border-radius: 12px; font-size: 18px; }
        .section { display: none; }
        .active { display: block; }
        .admin-only { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: center; }
        th { background: #f1f5f9; color: var(--primary); }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; }
        .btn-login { background: var(--admin); }
        .btn-add { background: var(--secondary); }
        .btn-view { background: var(--primary); }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin: 5px; width: 85%; max-width: 300px; }
    </style>
</head>
<body>

<div class="warning-bar">
    ⚠️ সতর্কতা: কেউ পাসওয়ার্ড পরিবর্তন ঘরে ক্লিক করবেন না।
</div>

<div class="container">
    <div class="header">
        <div class="logo-container">
            <img id="f-logo" src="https://i.ibb.co/v6mXmDqC/1000235257.jpg" 
                 onerror="this.src='https://i.postimg.cc/85M2N3Xg/1000235257.jpg'" 
                 alt="Foundation Logo">
        </div>
        <h1 class="main-title">আল ইত্তেহাদ ফাউন্ডেশন</h1>
    </div>

    <div class="admin-bar">
        <div id="admin-status">👤 মোড: <strong>সাধারণ সদস্য</strong></div>
        <div style="margin-top:15px;">
            <input type="password" id="login-input" placeholder="পাসওয়ার্ড লিখুন">
            <button class="btn btn-login" onclick="handleLogin()">লগইন</button>
            <button id="change-pass-btn" class="btn" style="background:#4b5563; display:none; margin-top:10px;" onclick="changePassword()">পাসওয়ার্ড পরিবর্তন</button>
        </div>
    </div>

    <div id="main-view" class="section active">
        <div class="stats">
            <div class="stat-card">সদস্য: <span id="total-members">০</span> জন</div>
            <div class="stat-card" style="background:#2d6a4f">মোট ফান্ড: <span id="total-fund">০</span> ৳</div>
        </div>
        <div class="admin-only" id="add-form-div" style="background:#f1f5f9; padding:20px; border-radius:12px; margin-bottom:20px;">
            <input type="text" id="m-name" placeholder="নাম">
            <input type="text" id="m-phone" placeholder="মোবাইল">
            <button class="btn btn-add" id="member-submit-btn" onclick="addMember()">যোগ করুন</button>
        </div>
        <table>
            <thead><tr><th>নাম ও মোবাইল</th><th>মোট জমা</th><th>অ্যাকশন</th></tr></thead>
            <tbody id="member-list-body"></tbody>
        </table>
    </div>

    <div id="member-detail-view" class="section">
        <button class="btn" style="background:#64748b; margin-bottom:15px;" onclick="showMain()">← ফিরে যান</button>
        <h2 id="detail-title"></h2>
        <div class="admin-only" id="entry-form-div" style="background:#f1f5f9; padding:20px; border-radius:12px; margin-bottom:20px;">
            <select id="e-month"></select>
            <input type="number" id="e-amount" placeholder="জমা">
            <input type="number" id="e-extra" placeholder="অতিরিক্ত">
            <input type="number" id="e-fine" placeholder="জরিমানা">
            <button class="btn btn-add" id="entry-submit-btn" onclick="addMonthlyEntry()">সেভ</button>
        </div>
        <table>
            <thead><tr><th>মাস</th><th>জমা</th><th>অতিরিক্ত</th><th>জরিমানা</th><th>মোট</th><th class="admin-only">অ্যাকশন</th></tr></thead>
            <tbody id="entry-list-body"></tbody>
            <tfoot><tr style="background:#f8fafc; font-weight:bold;"><td colspan="4" style="text-align:right">ব্যক্তিগত মোট:</td><td id="p-total-display">০</td><td class="admin-only"></td></tr></tfoot>
        </table>
    </div>
</div>

<script>
    const dbURL = "https://ittehad2-db-49332-default-rtdb.firebaseio.com/.json"; 
    const _secret = "QXNoaWtANDc1MQ=="; // Ashik@4751
    
    let isAdmin = false;
    let members = [];

    function handleLogin() {
        const input = document.getElementById('login-input').value;
        const customPass = localStorage.getItem('ittehad_vfinal_fix_v4');
        
        if (input === atob(_secret) || (customPass && input === customPass)) {
            isAdmin = true;
            document.getElementById('admin-status').innerHTML = "✅ মোড: <strong>এডমিন</strong>";
            document.getElementById('change-pass-btn').style.display = 'inline-block';
            renderMain();
            alert("লগইন সফল!");
        } else {
            alert("ভুল পাসওয়ার্ড!");
        }
    }

    function changePassword() {
        if (!isAdmin) return;
        const newPass = prompt("নতুন পাসওয়ার্ড দিন:");
        if (newPass && newPass.length >= 4) {
            localStorage.setItem('ittehad_vfinal_fix_v4', newPass);
            alert("পাসওয়ার্ড পরিবর্তন সফল!");
        }
    }

    async function fetchData() {
        try {
            const response = await fetch(dbURL);
            const data = await response.json();
            members = (data && data.members) ? data.members : (Array.isArray(data) ? data : []);
            renderMain();
        } catch (e) { console.error("Error:", e); }
    }

    async function saveData() {
        try {
            await fetch(dbURL, { method: "PUT", body: JSON.stringify({ members: members }) });
            renderMain();
        } catch (e) { alert("সেভ করতে সমস্যা হয়েছে!"); }
    }

    function generateMonths() {
        const select = document.getElementById('e-month');
        const months = ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"];
        for (let y = 2025; y <= 2027; y++) {
            months.forEach(m => { let o = document.createElement('option'); o.text = `${m} ${y}`; select.add(o); });
        }
    }

    function renderMain() {
        const body = document.getElementById('member-list-body');
        if(!body) return;
        body.innerHTML = ''; let totalFund = 0;
        members.forEach((m, i) => {
            if(!m) return;
            let pTotal = (m.entries || []).reduce((acc, curr) => acc + (Number(curr.amount || 0) + Number(curr.extra || 0) + Number(curr.fine || 0)), 0);
            totalFund += pTotal;
            body.innerHTML += `<tr>
                <td><strong>${m.name}</strong><br><small>${m.phone || ''}</small></td>
                <td>${pTotal} ৳</td>
                <td>
                    <button class="btn btn-view" onclick="viewMember(${i})">দেখুন</button>
                    ${isAdmin ? `<button class="btn" style="background:var(--edit); font-size:11px;" onclick="editMember(${i})">এডিট</button> <button class="btn" style="background:var(--danger); font-size:11px;" onclick="deleteMember(${i})">X</button>` : ''}
                </td>
            </tr>`;
        });
        document.getElementById('total-members').innerText = members.length;
        document.getElementById('total-fund').innerText = totalFund;
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = isAdmin ? 'block' : 'none');
    }

    function viewMember(i) {
        currentIdx = i;
        document.getElementById('main-view').classList.remove('active');
        document.getElementById('member-detail-view').classList.add('active');
        document.getElementById('detail-title').innerText = members[i].name + " এর হিসাব";
        renderEntries();
    }

    function showMain() { currentIdx = null; document.getElementById('member-detail-view').classList.remove('active'); document.getElementById('main-view').classList.add('active'); renderMain(); }

    function addMember() {
        let name = document.getElementById('m-name').value;
        let phone = document.getElementById('m-phone').value;
        if(!name) return;
        members.push({name, phone, entries: []});
        saveData();
        document.getElementById('m-name').value=''; document.getElementById('m-phone').value='';
    }

    function addMonthlyEntry() {
        let data = {
            month: document.getElementById('e-month').value,
            amount: Number(document.getElementById('e-amount').value || 0),
            extra: Number(document.getElementById('e-extra').value || 0),
            fine: Number(document.getElementById('e-fine').value || 0)
        };
        if(!members[currentIdx].entries) members[currentIdx].entries = [];
        members[currentIdx].entries.push(data);
        saveData(); renderEntries();
        document.getElementById('e-amount').value=''; document.getElementById('e-extra').value=''; document.getElementById('e-fine').value='';
    }

    function renderEntries() {
        const body = document.getElementById('entry-list-body'); body.innerHTML = ''; let personalTotal = 0;
        (members[currentIdx].entries || []).forEach((e, i) => {
            let rowSum = Number(e.amount || 0) + Number(e.extra || 0) + Number(e.fine || 0);
            personalTotal += rowSum;
            body.innerHTML += `<tr>
                <td>${e.month}</td><td>${e.amount}</td><td>${e.extra}</td><td>${e.fine}</td><td>${rowSum}</td>
                <td class="admin-only">${isAdmin ? `<button class="btn" style="background:var(--danger); font-size:11px;" onclick="deleteEntry(${i})">X</button>` : ''}</td>
            </tr>`;
        });
        document.getElementById('p-total-display').innerText = personalTotal + " ৳";
        document.querySelectorAll('.admin-only').forEach(el => el.style.display = isAdmin ? 'block' : 'none');
    }

    function deleteMember(i) { if(confirm("ডিলিট করবেন?")) { members.splice(i, 1); saveData(); } }
    function deleteEntry(i) { if(confirm("ডিলিট করবেন?")) { members[currentIdx].entries.splice(i, 1); saveData(); renderEntries(); } }

    window.onload = function() { generateMonths(); fetchData(); };
</script>
</body>
</html>
